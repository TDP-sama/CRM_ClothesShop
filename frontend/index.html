<!doctype html>
<html lang="vi" data-theme="co-ban">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MODA – thời trang mỗi ngày. Giao hàng toàn quốc, thanh toán khi nhận hàng." />
    <title>MODA – Thời trang mỗi ngày</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Montserrat:wght@500;700;800&family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap&subset=vietnamese"
    />
    <script>
      // Apply the saved theme before first paint to avoid a flash of the default style.
      try {
        var t = localStorage.getItem('moda-theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
