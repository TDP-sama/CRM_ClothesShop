# Profile "keycloak": "Sign in with Google" through the Keycloak server from docker-compose.yml (realm "moda",
# see keycloak/realm-moda.json). Enable with spring.profiles.active=keycloak (or "redis,keycloak") in backend/.env.
# Keycloak must be running when the app starts: Spring reads its OpenID configuration from the issuer URI.

spring.security.oauth2.client.registration.keycloak.client-id=${KEYCLOAK_CLIENT_ID:moda-shop}
# Development-only default matching the local realm import; set a real secret for any shared Keycloak.
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:moda-dev-secret}
spring.security.oauth2.client.registration.keycloak.scope=openid,email,profile
spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/moda}
# The principal name is the email, like for password logins (all account lookups are by email).
spring.security.oauth2.client.provider.keycloak.user-name-attribute=email
