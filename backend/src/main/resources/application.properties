spring.application.name=shop-backend

# Hosting platforms (e.g. Render) pass the port in PORT and terminate HTTPS in front of the app; honoring
# X-Forwarded-* makes request.isSecure() true there, so cookies such as XSRF-TOKEN get the Secure flag.
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Local secrets file (git-ignored). Works whether the app is started from backend/ or the repo root.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# JDBC URL including credentials, from backend/.env or the DATABASE_URL environment variable, e.g.
# jdbc:postgresql://<host>/neondb?user=<user>&password=<password>&sslmode=require
spring.datasource.url=${DATABASE_URL:}

# Creates/updates tables from the entity classes. Fine for learning; use migrations (Flyway) for real apps.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Loads lazy collections (images, variants) of a page of products in a few queries instead of one per product.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Error responses as RFC 9457 problem+json.
spring.mvc.problemdetails.enabled=true

# Swagger UI: copy the XSRF-TOKEN cookie into the X-XSRF-TOKEN header so "Try it out" works for POST/PATCH/DELETE.
springdoc.swagger-ui.csrf.enabled=true

# Session cookie used for authentication. No signing secret is needed: the session id is random and
# the session lives server-side. HttpOnly keeps it away from JavaScript; SameSite=Lax blocks cross-site POSTs.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Must be true in production (HTTPS). Defaults to false only so the local http://localhost dev setup works.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=${SESSION_TIMEOUT:2h}

# Comma-separated emails that get the ADMIN role (on registration and at startup), e.g. ADMIN_EMAILS=me@example.com
app.admin-emails=${ADMIN_EMAILS:}
# Inserts demo categories and products when the catalog is empty.
app.seed-demo-data=${SEED_DEMO_DATA:true}
