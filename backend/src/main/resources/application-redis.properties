# Profile "redis": HTTP sessions are stored in Redis (Spring Session) instead of server memory, so they survive
# restarts and can be shared by several app instances. Enable with spring.profiles.active=redis (in backend/.env)
# or SPRING_PROFILES_ACTIVE=redis.

# Re-enable Spring Session + Redis (the default profile excludes them); Redis repositories stay off, none are used.
spring.autoconfigure.exclude=org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration

spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.session.redis.namespace=moda:session
