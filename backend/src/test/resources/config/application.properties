# Test-only overrides. classpath:/config/ outranks both application.properties and the backend/.env it imports, so
# tests never use the developer's real services from .env: no SMTP (tests that need mail mock JavaMailSender) and
# none of the redis/keycloak profiles. Tests set their own H2 datasource.
spring.profiles.active=
spring.autoconfigure.exclude=\
  org.springframework.boot.mail.autoconfigure.MailSenderAutoConfiguration,\
  org.springframework.boot.session.autoconfigure.SessionAutoConfiguration,\
  org.springframework.boot.session.data.redis.autoconfigure.SessionDataRedisAutoConfiguration,\
  org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration,\
  org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration,\
  org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration,\
  org.springframework.boot.data.redis.autoconfigure.observation.LettuceObservationAutoConfiguration
