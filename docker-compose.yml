# Local helper services for development: `docker compose up -d` (Docker Desktop must be running).
# The app itself still runs with `mvn spring-boot:run` + `npm run dev` and connects to these on localhost.
# Production (Render) does not use this file.
services:
  # Session store, used when the app runs with the "redis" profile (spring.profiles.active=redis).
  redis:
    image: redis:8.8
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # Fake mail server: catches every email the app sends. Inbox UI at http://localhost:8025, SMTP on port 1025.
  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  # Identity broker for "Sign in with Google", used when the app runs with the "keycloak" profile.
  # Admin console: http://localhost:8180 (admin / admin, development only). Realm "moda" and its client are imported
  # from keycloak/realm-moda.json on first start; the Google identity provider is added once in the console.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      # The whole data dir: it exists in the image owned by the keycloak user, so the new volume inherits that
      # ownership (a volume on a path missing from the image is created root-owned and Keycloak cannot write it).
      - keycloak-data:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import:ro
    restart: unless-stopped

volumes:
  redis-data:
  keycloak-data:
